# GitLab CI for vauchi-windows-hw, the hardware shell (ADR-077).
#
# The portable library (ports, sessions, the shell) builds and is tested
# in a Linux container against scripted backends, the contract's shared
# fixture included (ADR-077 D-7). The Windows backends and the terminal
# helper build on the Windows runner when they land.

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # A merge must not cancel a main pipeline other repos wait on (VCI05).
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

default:
  interruptible: true

include:
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.11.17
    file:
      - '/ci-templates/lint-docs.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/auto-tag.yml'
      - '/ci-templates/github-mirror.yml'

variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.11.17"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

stages:
  - auto-tag
  - lint
  - test
  - deploy

# A version bump merged to main is the release: the job pushes
# v<Version of Directory.Build.props> when that tag does not exist yet, so
# the tag always sits on the merged commit (private#1045).
auto-tag:version:
  extends: .auto-tag
  variables:
    AUTO_TAG_VERSION_CMD: "sed -n 's:.*<Version>\\(.*\\)</Version>.*:\\1:p' Directory.Build.props | sed -n 1p"

# The portable library names no Windows API, no display toolkit and no
# Core assembly, and the contract is its only package. The check's own
# tests plant each violation first (CC-27).
lint:portable:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.12-alpine
  tags: [docker]
  needs: []
  script:
    - python3 ci/tests/check-portable-library.test.py
    - python3 ci/check-portable-library.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Every command and event of the shell against scripted backends, the
# hardware commands and events of the contract's shared fixture among
# them, on every merge request: CI runners have no radios (ADR-077 item 9,
# D-7). The package is built from what was tested.
contract:replay:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0-alpine3.21
  tags: [docker]
  needs: []
  script:
    - dotnet restore tests/Vauchi.WindowsHw.Tests/Vauchi.WindowsHw.Tests.csproj --locked-mode
    - dotnet build tests/Vauchi.WindowsHw.Tests/Vauchi.WindowsHw.Tests.csproj -c Release --no-restore
    - dotnet test tests/Vauchi.WindowsHw.Tests/Vauchi.WindowsHw.Tests.csproj -c Release --no-build
    - dotnet pack src/Vauchi.WindowsHw/Vauchi.WindowsHw.csproj -c Release --no-build -o target/nuget
    # The Windows backends compile here against the Windows SDK's reference
    # assemblies and are packed; nothing in them runs in this container.
    - dotnet pack src/Vauchi.WindowsHw.Native/Vauchi.WindowsHw.Native.csproj -c Release -o target/nuget
    # zxing-cpp's native library rides in the package's build/zxing-cpp/
    # and the dependency leaves it out, or a consumer's output folder holds
    # it as ZXing.dll where ZXing.Net's zxing.dll is (private#772).
    - |
      set -eu
      apk add --no-cache unzip > /dev/null
      pkg=$(ls target/nuget/vauchi-windows-hw-native.*.nupkg)
      unzip -l "$pkg" | grep -q ' build/zxing-cpp/ZXing.dll$' || { echo "ERROR: $pkg has no build/zxing-cpp/ZXing.dll"; exit 1; }
      unzip -p "$pkg" vauchi-windows-hw-native.nuspec | grep 'id="ZXingCpp"' | grep -q 'exclude="[^"]*Native' || { echo "ERROR: $pkg's ZXingCpp dependency brings its native library"; exit 1; }
      echo "$pkg carries zxing-cpp's native library in build/zxing-cpp/"
  artifacts:
    when: always
    paths:
      - target/nuget/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# The Windows backends and the helper on Windows (pam): the library's tests,
# the helper driven as a process, and the helper compiled ahead of time with
# the same process tests run against that file. The container above only
# compiles the backends; this is where they load. Each native command's exit
# code is checked: PowerShell carries on past a failed one, and a failed
# publish leaves the previous file for the tests to pass against.
test:windows:
  stage: test
  tags: [windows, dotnet]
  needs: []
  variables:
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget-packages
  script:
    - |
      $ErrorActionPreference = 'Stop'
      function Run { param([string]$What, [scriptblock]$Command)
        Write-Host "== $What"
        & $Command
        if ($LASTEXITCODE -ne 0) { throw "$What failed with exit code $LASTEXITCODE" }
      }
      # The ahead-of-time linker is found through vswhere, which is not on PATH by default.
      $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
      if (Test-Path "$installer\vswhere.exe") { $env:PATH = "$env:PATH;$installer" } else { Write-Host "no vswhere at $installer" }
      Run 'dotnet' { dotnet --version }
      Run 'library tests' { dotnet test tests/Vauchi.WindowsHw.Tests/Vauchi.WindowsHw.Tests.csproj -c Release }
      Run 'decoder tests' { dotnet test tests/Vauchi.WindowsHw.Native.Tests/Vauchi.WindowsHw.Native.Tests.csproj -c Release }
      Run 'notification tests' { dotnet test tests/Vauchi.WindowsHw.Notifications.Tests/Vauchi.WindowsHw.Notifications.Tests.csproj -c Release }
      # The Windows App SDK builds on Windows only, so its package is packed here.
      Run 'notifications package' { dotnet pack src/Vauchi.WindowsHw.Notifications/Vauchi.WindowsHw.Notifications.csproj -c Release -o target/nuget-windows }
      Run 'probe build' { dotnet build tools/Probe/Probe.csproj -c Release }
      Run 'helper process tests' { dotnet test tests/Vauchi.WindowsHw.Host.Tests/Vauchi.WindowsHw.Host.Tests.csproj -c Release }
      if (Test-Path target/host-aot) { Remove-Item -Recurse -Force target/host-aot }
      Run 'helper ahead of time' { dotnet publish src/vauchi-hw-host/vauchi-hw-host.csproj -c Release -r win-x64 -o target/host-aot }
      $helper = (Resolve-Path target/host-aot/vauchi-hw-host.exe).Path
      Write-Host "helper: $helper, $((Get-Item $helper).Length) bytes"
      $env:VAUCHI_HW_HOST = $helper
      Run 'helper process tests, ahead of time' { dotnet test tests/Vauchi.WindowsHw.Host.Tests/Vauchi.WindowsHw.Host.Tests.csproj -c Release --no-build }
  artifacts:
    when: on_success
    expire_in: 2 weeks
    paths:
      - target/host-aot/vauchi-hw-host.exe
      - target/nuget-windows/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# The signing step of publish:helper with a throwaway key, on every merge
# request: publish:helper runs only on a release tag, too late to learn it
# is broken. Same image and cosign as publish:helper.
test:sign-helper:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  script:
    - |
      set -eu
      apk add --no-cache curl >/dev/null
      curl -sSfL "https://github.com/sigstore/cosign/releases/download/v3.0.5/cosign-linux-amd64" -o /usr/local/bin/cosign
      echo "db15cc99e6e4837daabab023742aaddc3841ce57f193d11b7c3e06c8003642b2  /usr/local/bin/cosign" | sha256sum -c -
      chmod +x /usr/local/bin/cosign
      sh ci/tests/sign-helper.test.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ci/sign-helper.sh
        - ci/tests/sign-helper.test.sh
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# A release tag publishes the helper test:windows built and tested on that
# tag, as Core publishes its Windows DLL (core ci/package.yml): the file, its
# SHA-256, and a cosign bundle over the checksum signed with the group's
# COSIGN_KEY, whose public half windows-app ships as cosign.pub. The bundle
# is verified here before anything is uploaded.
publish:helper:
  stage: deploy
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: ["test:windows"]
  script:
    - |
      set -eu
      apk add --no-cache curl >/dev/null
      COSIGN_VERSION="v3.0.5"
      COSIGN_SHA256="db15cc99e6e4837daabab023742aaddc3841ce57f193d11b7c3e06c8003642b2"
      curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
      echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
      chmod +x /usr/local/bin/cosign
      helper=target/host-aot/vauchi-hw-host.exe
      if [ ! -s "$helper" ]; then
        echo "ERROR: test:windows left no $helper for tag $CI_COMMIT_TAG"
        exit 1
      fi
      sh ci/sign-helper.sh "$helper" dist
      base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-hw-host/${CI_COMMIT_TAG#v}"
      for file in vauchi-hw-host.exe vauchi-hw-host.exe.sha256 vauchi-hw-host.exe.sha256.bundle; do
        status=$(curl -s -o upload.out -w '%{http_code}' --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "dist/$file" "$base/$file") || status=000
        case "$status" in
          200|201) echo "uploaded $file" ;;
          *) echo "ERROR: uploading $file answered HTTP $status: $(head -c 300 upload.out)"; exit 1 ;;
        esac
      done
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# A release tag publishes the two packages its own pipeline built to this
# project's NuGet registry: the portable library, which was tested here,
# and the Windows backends. windows-app pins them from there (ADR-077 D-3).
publish:nuget:
  stage: deploy
  image: mcr.microsoft.com/dotnet/sdk:8.0-alpine3.21
  tags: [docker]
  needs:
    - job: contract:replay
      artifacts: true
    - job: test:windows
      artifacts: true
  script:
    - |
      set -eu
      packages="target/nuget/vauchi-windows-hw target/nuget/vauchi-windows-hw-native target/nuget-windows/vauchi-windows-hw-notifications"
      for package in $packages; do
        if [ ! -f "$package.${CI_COMMIT_TAG#v}.nupkg" ]; then
          echo "ERROR: tag $CI_COMMIT_TAG has no package $package.${CI_COMMIT_TAG#v}.nupkg; Directory.Build.props and the tag disagree"
          exit 1
        fi
      done
      dotnet nuget add source "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json" --name gitlab --username gitlab-ci-token --password "${CI_JOB_TOKEN}" --store-password-in-clear-text
      for package in $packages; do
        # A retried job finds its package already there and must not fail on it.
        dotnet nuget push "$package.${CI_COMMIT_TAG#v}.nupkg" --source gitlab --skip-duplicate
      done
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

github-mirror:
  extends: .github-mirror
